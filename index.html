<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Avance de Obra</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .login-brand { text-align: center; margin-bottom: 18px; }
  .login-logo { display: block; margin: 0 auto 14px; height: 110px; width: auto; max-width: 100%; }
  .login-brand h1 { margin: 0 0 4px; }
  .login-brand .subtitle { margin: 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="logo.png" alt="Logo" class="login-logo">
      <h1>Control de Avance de Obra</h1>
    </div>

    <div id="msgBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" autocomplete="organization" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Ingresar</button>
    </form>

    <div class="toggle-link">¿Olvidaste tu contraseña? Pide a tu administrador que la restablezca.</div>
  </div>
</div>
<footer style="text-align:center;font-size:12px;color:#8a8a85;padding:18px 12px 22px;">© 2026 ZUHAUS GROUP. Todos los derechos reservados.</footer>

<script src="js/supabase-config.js"></script>
<script>
const DOMINIO = "example.com";   // debe coincidir con la función "usuarios"
const form = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");
const msgBox = document.getElementById("msgBox");
try { document.getElementById("empresa").value = localStorage.getItem("ultimaEmpresa") || ""; } catch (e) {}

function showMsg(text) { msgBox.innerHTML = `<div class="error-msg">${text}</div>`; }

supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = "modulos.html";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msgBox.innerHTML = "";
  const empresa = document.getElementById("empresa").value.trim().toLowerCase();
  const usuario = document.getElementById("usuario").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  // Acceso con correo (cuentas anteriores) o con empresa + usuario
  let email = usuario;
  if (!usuario.includes("@")) {
    if (!empresa) { showMsg("Escribe el código de tu empresa."); return; }
    email = `${usuario}.${empresa}@${DOMINIO}`;
  }
  submitBtn.disabled = true;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  submitBtn.disabled = false;
  if (error) { showMsg("Empresa, usuario o contraseña incorrectos."); return; }
  try { if (empresa) localStorage.setItem("ultimaEmpresa", empresa); } catch (e2) {}
  window.location.href = "modulos.html";
});
</script>
</body>
</html>
